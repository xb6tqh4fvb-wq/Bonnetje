<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonnetje — Automatische tests (v20)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    .pass { color: #0f5132; background: #e7f6ec; padding: 0.6rem 0.8rem; border-radius: 8px; margin: 0.4rem 0; }
    .fail { color: #7a120a; background: #fdecec; padding: 0.6rem 0.8rem; border-radius: 8px; margin: 0.4rem 0; }
  </style>
</head>
<body>
  <h1>Bonnetje — Automatische tests (v20)</h1>
  <p id="summary">Tests worden uitgevoerd…</p>
  <div id="results"></div>
  <script type="module">
    import { runAllTests, runAsyncTests } from './calculator.test.js';
    const results = [...runAllTests(), ...(await runAsyncTests())];
    const container = document.getElementById('results');
    let passed = 0;
    for (const r of results) {
      if (r.passed) passed++;
      const div = document.createElement('div');
      div.className = r.passed ? 'pass' : 'fail';
      div.textContent = `${r.passed ? '✓ PASS' : '✕ FAIL'}: ${r.name}${r.error ? ' — ' + r.error : ''}`;
      container.appendChild(div);
    }
    document.getElementById('summary').textContent = `Resultaat: ${passed} van de ${results.length} tests geslaagd.`;
  </script>
</body>
</html>
