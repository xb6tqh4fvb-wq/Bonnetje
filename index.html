<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bonnetje</title>
  <meta name="description" content="Verdeel een restaurantbon eerlijk over de deelnemers.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bonnetje">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var d = JSON.parse(localStorage.getItem('bonnetje.display')) || {};
      var r = document.documentElement;
      if (d.theme && d.theme !== 'auto') r.dataset.theme = d.theme;
      if (d.size) r.dataset.size = d.size;
      if (d.contrast === true || (d.contrast == null && matchMedia('(prefers-contrast: more)').matches)) r.dataset.contrast = 'on';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Deze app heeft JavaScript nodig.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
